# GitLab -> Wikimedia Gerrit bridge for mediawiki/extensions/UmamiAnalytics.
#
# GitLab and Gerrit keep separate histories with identical content: your
# GitLab e-mail is used on GitLab, your Gerrit e-mail on Gerrit. GitLab
# branches are never force-pushed.
#
# - gerrit:push  On every push to `main` (or a REL1_* branch), copies the new
#                commits to Gerrit with `git review`, then (optionally)
#                approves (+2) and submits them.
# - gerrit:sync  Copies Gerrit-only commits (bots, admins, release branches)
#                to GitLab. Runs from a pipeline schedule, or manually from
#                any pipeline on `main`.
#
# Setup and operating instructions: .gitlab/ci/README.md

variables:
  GERRIT_HOST: gerrit.wikimedia.org
  GERRIT_PORT: "29418"
  GERRIT_USER: linedwell
  GERRIT_PROJECT: mediawiki/extensions/UmamiAnalytics
  # GitLab `main` <-> Gerrit `master`; every other branch keeps its name.
  GITLAB_MAIN_BRANCH: main
  GERRIT_MAIN_BRANCH: master
  # "true": vote Code-Review +2 and submit right after upload.
  # Set to "false" (CI/CD variable or "Run pipeline" form) to review in Gerrit.
  GERRIT_AUTO_SUBMIT: "true"
  # Seconds/attempts to wait for a change to become submittable
  # (e.g. if a Verified vote from CI is ever required).
  GERRIT_SUBMIT_ATTEMPTS: "10"
  GERRIT_SUBMIT_INTERVAL: "30"
  # Gerrit branches mirrored back to GitLab by gerrit:sync.
  SYNC_BRANCH_REGEX: '^(master|REL1_[0-9]+)$'

stages:
  - test     # Put test/lint jobs here: gerrit:push waits for them.
  - gerrit

.gerrit-base:
  stage: gerrit
  image: python:3.12-alpine
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"          # Full history is required for rebase/cherry checks.
  resource_group: gerrit    # Never run two Gerrit jobs at the same time.
  interruptible: false
  before_script:
    - apk add --no-cache bash git openssh-client >/dev/null
    - pip install --quiet --disable-pip-version-check --root-user-action=ignore "git-review>=2.4,<3"

gerrit:push:
  extends: .gerrit-base
  script:
    - bash .gitlab/ci/gerrit-push.sh
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && ($CI_COMMIT_BRANCH == $GITLAB_MAIN_BRANCH || $CI_COMMIT_BRANCH =~ /^REL1_[0-9]+$/)'

gerrit:sync:
  extends: .gerrit-base
  script:
    - bash .gitlab/ci/gerrit-sync.sh
  # Exit code 3 = some branch needs attention: shown as a warning, not a failure.
  # (exit_codes is only allowed at job level, not inside rules.)
  allow_failure:
    exit_codes: [3]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $GITLAB_MAIN_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $GITLAB_MAIN_BRANCH'
      when: manual
      allow_failure: true

# Escape hatch (manual): adds one commit on GitLab ALIGN_BRANCH (default main)
# making its content identical to Gerrit. Use it when a branch is stuck on a
# conflict. See .gitlab/ci/README.md.
gerrit:align:
  extends: .gerrit-base
  script:
    - bash .gitlab/ci/gerrit-align.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH == $GITLAB_MAIN_BRANCH'
      when: manual
      allow_failure: true